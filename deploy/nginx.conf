worker_processes auto;
events { worker_connections 8192; }
http {
    access_log off;
    server_tokens off;
    # Resolve Docker service IP changes after replacing a shard container.
    resolver 127.0.0.11 valid=10s ipv6=off;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    # Preserve the public HTTPS scheme when using the supplied local tunnel.
    map $http_x_forwarded_proto $origin_scheme {
        default $scheme;
        https https;
    }
    split_clients $request_id $creation_shard {
        25% shard0;
        25% shard1;
        25% shard2;
        * shard3;
    }
    # A room ALWAYS returns to its owner, independent of browser cookies/IP.
    map $uri $room_backend {
        default $creation_shard;
        ~^/(room|ws)/0[0-9][0-9](/|$) shard0;
        ~^/(room|ws)/1[0-9][0-9](/|$) shard1;
        ~^/(room|ws)/2[0-9][0-9](/|$) shard2;
        ~^/(room|ws)/3[0-9][0-9](/|$) shard3;
    }
    server {
        listen 80;
        client_max_body_size 16k;
        location / {
            proxy_pass http://$room_backend:3055;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-Proto $origin_scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_buffering off;
            proxy_read_timeout 75s;
            proxy_send_timeout 10s;
            # Retrying on another shard would lose the room/host authority.
            proxy_next_upstream off;
        }
    }
}
